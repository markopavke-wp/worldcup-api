databases:
  - name: worldcup-db
    plan: free
    databaseName: worldcup
    user: worldcup

services:
  - type: web
    name: worldcup-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: worldcup-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_LEAGUE_ID
        value: "1"
      - key: API_FOOTBALL_SEASON
        value: "2026"
      - key: ENABLE_CRON
        value: "true"
      - key: SYNC_CRON
        value: "*/15 * * * *"
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_SYNC_KEY
        generateValue: true
